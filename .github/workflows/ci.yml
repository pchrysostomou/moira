name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every matrix job asserts the same pinned golden trace hash, so
      # "byte-identical traces across Node versions" (SPEC §10.1) is an
      # enforced fact, not a claim.
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      # pnpm/setup is the successor to pnpm/action-setup for pnpm 11+.
      # It reads the pnpm version from packageManager in package.json,
      # installs node, and caches the pnpm store.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @moirae/studio build
      # The stranger's path: pack the CLI, install the tarball into an empty
      # directory with no workspace and no lockfile, and run the demo cold.
      - run: pnpm --filter moirae pack --pack-destination "$RUNNER_TEMP/pack"
      - run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/moirae-*.tgz
          time npx moirae demo --no-open --no-serve
          test -s moirae-demo.jsonl
          npx moirae --version

  # The Rust half (ADR-009): the trace writer and scheduler crates. The
  # toolchain comes from rust-toolchain.toml, so CI and local runs match.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
